<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in | StockPilot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
:root {
    --ink: #10302f;
    --ink-2: #1a4543;
    --saffron: #f0a202;
    --mint: #2e9e6b;
    --rose: #d64550;
    --text: #1d2b2a;
    --muted: #5d716e;
    --line: rgba(16, 48, 47, 0.12);
    --card: rgba(255, 255, 255, 0.74);
    --radius: 14px;
}

* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: "Manrope", "Segoe UI", Arial, sans-serif;
    color: var(--text);
    background: linear-gradient(160deg, #cfe0d8 0%, #e3e9ee 55%, #ecdfd2 100%) fixed;
    min-height: 100vh;
}

a { color: inherit; text-decoration: none; }
h1, h2, h3 { margin: 0; letter-spacing: -0.01em; }

/* ---------- Layout ---------- */
.sidebar {
    position: fixed;
    inset: 0 auto 0 0;
    width: 248px;
    background: linear-gradient(180deg, var(--ink) 0%, #0b2221 100%);
    color: #dfece8;
    display: flex;
    flex-direction: column;
    padding: 26px 16px;
    z-index: 20;
}

.brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 19px;
    font-weight: 800;
    padding: 0 10px 28px;
}

.brand-mark {
    width: 34px;
    height: 34px;
    border-radius: 10px;
    background: var(--saffron);
    color: var(--ink);
    display: grid;
    place-items: center;
    font-size: 18px;
}

.nav a {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 12px;
    margin-bottom: 4px;
    border-radius: 10px;
    font-weight: 600;
    font-size: 14.5px;
    color: #b9cfc9;
    border-left: 3px solid transparent;
}

.nav a:hover { background: rgba(255, 255, 255, 0.07); color: #fff; }

.nav a.active {
    background: rgba(240, 162, 2, 0.14);
    color: #fff;
    border-left-color: var(--saffron);
}

.nav .group { margin: 22px 12px 8px; font-size: 12.5px; color: #7f9c96; }

.sidebar-foot { margin-top: auto; padding: 14px 10px 0; border-top: 1px solid rgba(255, 255, 255, 0.1); }
.sidebar-foot .who { font-size: 13px; color: #9fb8b2; margin-bottom: 10px; }
.sidebar-foot button { width: 100%; background: rgba(255, 255, 255, 0.1); color: #fff; }
.sidebar-foot button:hover { background: rgba(214, 69, 80, 0.85); }

.main { margin-left: 248px; padding: 32px 36px 48px; max-width: 1280px; }

.topbar { display: none; }

.page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
.page-head h1 { font-size: 28px; font-weight: 800; }
.page-head p { margin: 4px 0 0; color: var(--muted); font-size: 14.5px; }

/* ---------- Cards ---------- */
.card {
    background: var(--card);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.7);
    border-radius: var(--radius);
    box-shadow: 0 8px 28px rgba(16, 48, 47, 0.08);
    padding: 22px;
    margin-bottom: 22px;
}

.card h2 { font-size: 17px; font-weight: 800; margin-bottom: 16px; }

.hero {
    background: linear-gradient(135deg, var(--ink) 0%, var(--ink-2) 100%);
    color: #dfece8;
    border-radius: var(--radius);
    padding: 28px 30px;
    margin-bottom: 22px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
    box-shadow: 0 12px 30px rgba(16, 48, 47, 0.25);
}

.hero .label { font-size: 14px; color: #9fc0b8; }
.hero .value { font-size: 44px; font-weight: 800; color: var(--saffron); letter-spacing: -0.02em; line-height: 1.15; }
.hero .meta { font-size: 13.5px; color: #9fc0b8; max-width: 260px; }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin-bottom: 22px; }

.stat { background: var(--card); border: 1px solid rgba(255, 255, 255, 0.7); border-radius: var(--radius); padding: 18px 20px; box-shadow: 0 8px 28px rgba(16, 48, 47, 0.08); border-left: 5px solid var(--ink); }
.stat .label { font-size: 13.5px; color: var(--muted); font-weight: 600; }
.stat .num { font-size: 30px; font-weight: 800; margin-top: 4px; }
.stat.good { border-left-color: var(--mint); }
.stat.good .num { color: var(--mint); }
.stat.bad { border-left-color: var(--rose); }
.stat.bad .num { color: var(--rose); }

.grid-2 { display: grid; grid-template-columns: 3fr 2fr; gap: 22px; }
.grid-2 .card { margin-bottom: 0; }
.grid-2 + .card, .grid-2 + .grid-2 { margin-top: 22px; }

.chart-box { position: relative; height: 290px; }

/* ---------- Forms & buttons ---------- */
label { font-size: 13.5px; font-weight: 700; display: block; margin-bottom: 6px; }

input, select {
    font-family: inherit;
    font-size: 14.5px;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 9px;
    background: rgba(255, 255, 255, 0.9);
    color: var(--text);
    width: 100%;
}

input:focus, select:focus, button:focus-visible, a:focus-visible {
    outline: 2px solid var(--saffron);
    outline-offset: 1px;
}

button, .btn {
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    padding: 10px 16px;
    border: none;
    border-radius: 9px;
    background: var(--ink);
    color: #fff;
    cursor: pointer;
    display: inline-block;
    transition: background 0.15s;
}

button:hover, .btn:hover { background: var(--ink-2); }
.btn-accent { background: var(--saffron); color: var(--ink); }
.btn-accent:hover { background: #ffb520; }
.btn-ghost { background: rgba(16, 48, 47, 0.08); color: var(--ink); }
.btn-ghost:hover { background: rgba(16, 48, 47, 0.16); }
.btn-danger { background: var(--rose); }
.btn-danger:hover { background: #bd3540; }
.btn-sm { padding: 6px 11px; font-size: 13px; }

.form-grid { display: grid; grid-template-columns: 2fr 1.3fr 1fr 1fr auto; gap: 14px; align-items: end; }

.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
.toolbar input[type="text"] { width: 250px; }
.toolbar select { width: 190px; }
.toolbar .spacer { flex: 1; }
.import-form { display: flex; gap: 8px; align-items: center; }
.import-form input[type="file"] { width: 230px; font-size: 13px; padding: 7px; }

/* ---------- Tables ---------- */
.table-wrap { overflow-x: auto; }

table { width: 100%; border-collapse: collapse; font-size: 14.5px; }

th {
    text-align: left;
    font-size: 13px;
    color: var(--muted);
    font-weight: 700;
    padding: 10px 12px;
    border-bottom: 2px solid var(--line);
    white-space: nowrap;
}

th a:hover { color: var(--ink); }
th a.sorted { color: var(--ink); }

td { padding: 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tbody tr:hover { background: rgba(255, 255, 255, 0.55); }
td.num, th.num { text-align: right; }
.muted { color: var(--muted); font-size: 13px; }
.empty { text-align: center; color: var(--muted); padding: 30px 12px; }

.badge { display: inline-block; padding: 4px 11px; border-radius: 99px; font-size: 12.5px; font-weight: 700; }
.badge.ok { background: rgba(46, 158, 107, 0.16); color: #1c7a4e; }
.badge.low { background: rgba(240, 162, 2, 0.2); color: #8a5d00; }
.badge.out { background: rgba(214, 69, 80, 0.16); color: #a82a35; }

.plus { color: var(--mint); font-weight: 800; }
.minus { color: var(--rose); font-weight: 800; }

.row-actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.row-actions form { display: inline-flex; gap: 4px; align-items: center; margin: 0; }
.row-actions input[type="number"] { width: 62px; padding: 6px 8px; font-size: 13px; }

/* ---------- Pagination ---------- */
.pager { display: flex; gap: 6px; justify-content: center; align-items: center; margin-top: 18px; flex-wrap: wrap; }
.pager a, .pager span { padding: 7px 12px; border-radius: 8px; font-size: 14px; font-weight: 700; background: rgba(16, 48, 47, 0.07); }
.pager a:hover { background: rgba(16, 48, 47, 0.16); }
.pager .current { background: var(--ink); color: #fff; }
.pager .disabled { opacity: 0.4; }

/* ---------- Flash ---------- */
.flash { padding: 12px 16px; border-radius: 10px; margin-bottom: 18px; font-weight: 700; font-size: 14.5px; }
.flash-success { background: rgba(46, 158, 107, 0.16); color: #17673f; border: 1px solid rgba(46, 158, 107, 0.4); }
.flash-error { background: rgba(214, 69, 80, 0.14); color: #98262f; border: 1px solid rgba(214, 69, 80, 0.4); }

/* ---------- Login ---------- */
.login-page {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 20px;
    background: linear-gradient(135deg, #0b2221 0%, #10302f 45%, #2b5d52 100%) fixed;
}

.login-card {
    width: 100%;
    max-width: 400px;
    background: rgba(255, 255, 255, 0.92);
    border-radius: 18px;
    padding: 34px 32px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
}

.login-card .brand { color: var(--ink); padding: 0 0 6px; }
.login-card p { color: var(--muted); margin: 0 0 22px; font-size: 14.5px; }
.login-card .field { margin-bottom: 16px; }
.login-card button { width: 100%; padding: 12px; font-size: 15px; }

/* ---------- Edit page ---------- */
.narrow { max-width: 620px; }
.narrow .field { margin-bottom: 16px; }
.narrow .actions { display: flex; gap: 10px; margin-top: 6px; }

/* ---------- Responsive ---------- */
@media (max-width: 960px) {
    .sidebar { transform: translateX(-100%); transition: transform 0.2s; }
    .sidebar.open { transform: translateX(0); }
    .main { margin-left: 0; padding: 18px 16px 40px; }
    .topbar {
        display: flex; align-items: center; justify-content: space-between;
        background: var(--ink); color: #fff; margin: -18px -16px 18px; padding: 12px 16px;
        font-weight: 800;
    }
    .topbar button { background: rgba(255, 255, 255, 0.14); padding: 7px 12px; }
    .stats, .grid-2, .form-grid { grid-template-columns: 1fr; }
    .grid-2 .card { margin-bottom: 22px; }
    .hero .value { font-size: 34px; }
    .toolbar input[type="text"], .toolbar select { width: 100%; }
}

/* ---------- Single page additions ---------- */
html { scroll-behavior: smooth; }
.section { scroll-margin-top: 20px; }

.toasts { position: fixed; top: 18px; right: 18px; z-index: 50; width: min(380px, calc(100vw - 36px)); }
.toasts .flash { box-shadow: 0 10px 28px rgba(16, 48, 47, 0.22); background-color: #fff; transition: opacity 0.4s; }
.toasts .flash-success { background-color: #e3f4ec; }
.toasts .flash-error { background-color: #fbe6e8; }

        /* ---------- Show / hide password ---------- */
        .pw-wrap { position: relative; }
        .pw-wrap input { padding-right: 46px; }
        .pw-wrap .pw-toggle {
            position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
            width: auto; padding: 6px; background: none; color: var(--muted);
            border-radius: 8px; display: grid; place-items: center; line-height: 0;
        }
        .pw-wrap .pw-toggle:hover { background: rgba(16, 48, 47, 0.1); color: var(--ink); }
        .pw-wrap .pw-toggle svg { width: 20px; height: 20px; }
        .pw-wrap .pw-toggle .eye-off { display: none; }
        .pw-wrap .pw-toggle.on .eye { display: none; }
        .pw-wrap .pw-toggle.on .eye-off { display: block; }
    </style>
</head>
<body class="login-page">
    <div class="login-card">
        <div class="brand"><span class="brand-mark">📦</span> StockPilot</div>
        <p>Log in to manage your inventory.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="flash flash-{{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST">
            <div class="field">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autofocus>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <div class="pw-wrap">
                    <input type="password" id="password" name="password" required>
                    <button type="button" class="pw-toggle" aria-label="Show password">
                    <svg class="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
                    <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 19C5 19 1 12 1 12a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                </button>
                </div>
            </div>
            <button type="submit" class="btn-accent">Log in</button>
        </form>
    </div>
    <script>
        // Eye icon: password show / hide
        document.querySelectorAll(".pw-toggle").forEach(function (btn) {
            btn.addEventListener("click", function () {
                var input = btn.parentElement.querySelector("input");
                var show = input.type === "password";
                input.type = show ? "text" : "password";
                btn.classList.toggle("on", show);
                btn.setAttribute("aria-label", show ? "Hide password" : "Show password");
            });
        });
    </script>
</body>
</html>
